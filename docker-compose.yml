services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: futera_postgres
    restart: always
    environment:
      POSTGRES_USER: futera_user
      POSTGRES_PASSWORD: futera_password
      POSTGRES_DB: futera_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futera_user -d futera_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: futera_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://futera_user:futera_password@postgres:5432/futera_db
      SECRET_KEY: futera_super_secret_jwt_key_cambodia_education_2026_modern_secure_token
      ENVIRONMENT: production
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]'
      # Reach a free Ollama install running on the host machine.
      AI_OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: futera_frontend
    restart: always
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
